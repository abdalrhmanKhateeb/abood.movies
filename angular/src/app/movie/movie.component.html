<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">

        <h2>Movies</h2>

        <button
            class="btn btn-primary"
            (click)="openCreateModal()">

            New Movie

        </button>

    </div>

    <table class="table table-bordered table-hover">

        <thead>

            <tr>

                <th>Title</th>
                <th>Genre</th>
                <th>Duration</th>
                <th>Price</th>
                <th>Director</th>
                <th width="180">Actions</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let movie of movies">

                <td>{{movie.title}}</td>
                <td>{{movie.genre}}</td>
                <td>{{movie.duration}} min</td>
                <td>{{movie.price}}</td>
                <td>{{movie.directorName}}</td>

                <td>

                    <button
                        class="btn btn-warning btn-sm me-2"
                        (click)="editMovie(movie)">

                        Edit

                    </button>

                    <button
                        class="btn btn-danger btn-sm"
                        (click)="deleteMovie(movie.id)">

                        Delete

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>

<div
class="modal fade show"
[style.display]="isModalOpen ? 'block':'none'"
*ngIf="isModalOpen">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>

{{selectedMovie ? 'Edit Movie' : 'New Movie'}}

</h5>

<button
class="btn-close"
(click)="isModalOpen=false">
</button>

</div>

<div class="modal-body">

<form [formGroup]="form">

<div class="mb-3">

<label>Title</label>

<input
class="form-control"
formControlName="title">

</div>

<div class="mb-3">

<label>Genre</label>

<select
class="form-select"
formControlName="genre">

<option *ngFor="let genre of genres">

{{genre}}

</option>

</select>

</div>

<div class="mb-3">

<label>Duration (minutes)</label>

<input
type="number"
class="form-control"
formControlName="duration">

</div>

<div class="mb-3">

<label>Price</label>

<input
type="number"
class="form-control"
formControlName="price">

</div>

<div class="mb-3">

<label>Director</label>

<select
class="form-select"
formControlName="directorId">

<option
*ngFor="let director of directors"
[value]="director.id">

{{director.name}}

</option>

</select>

</div>

</form>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
(click)="isModalOpen=false">

Cancel

</button>

<button
class="btn btn-primary"
(click)="save()">

Save

</button>

</div>

</div>

</div>

</div>
