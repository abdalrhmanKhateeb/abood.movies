<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">

        <h2>{{ 'Directors' | abpLocalization }}</h2>

        <button
            class="btn btn-primary"
            (click)="openCreateModal()">

            {{ 'NewDirector' | abpLocalization }}

        </button>

    </div>

    <table class="table table-bordered table-hover">

        <thead>

            <tr>

                <th>{{ 'Name' | abpLocalization }}</th>

                <th>{{ 'Nationality' | abpLocalization }}</th>

                <th width="180">
                    {{ 'Actions' | abpLocalization }}
                </th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let director of directors">

                <td>{{ director.name }}</td>

                <td>{{ director.nationality }}</td>

                <td>

                    <button
                        class="btn btn-warning btn-sm me-2"
                        (click)="editDirector(director)">

                        {{ 'Edit' | abpLocalization }}

                    </button>

                    <button
                        class="btn btn-danger btn-sm"
                        (click)="deleteDirector(director.id)">

                        {{ 'Delete' | abpLocalization }}

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>


<div
    class="modal fade show"
    [style.display]="isModalOpen ? 'block' : 'none'"
    *ngIf="isModalOpen">

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5>

                    {{
                        selectedDirector
                        ? ('EditDirector' | abpLocalization)
                        : ('NewDirector' | abpLocalization)
                    }}

                </h5>


                <button
                    class="btn-close"
                    (click)="isModalOpen=false">

                </button>

            </div>



            <div class="modal-body">

                <form [formGroup]="form">


                    <div class="mb-3">

                        <label>
                            {{ 'Name' | abpLocalization }}
                        </label>

                        <input
                            class="form-control"
                            formControlName="name">

                    </div>



                    <div class="mb-3">

                        <label>
                            {{ 'Nationality' | abpLocalization }}
                        </label>

                        <input
                            class="form-control"
                            formControlName="nationality">

                    </div>


                </form>

            </div>



            <div class="modal-footer">


                <button
                    class="btn btn-secondary"
                    (click)="isModalOpen=false">

                    {{ 'Cancel' | abpLocalization }}

                </button>



                <button
                    class="btn btn-primary"
                    (click)="save()">

                    {{ 'Save' | abpLocalization }}

                </button>


            </div>


        </div>

    </div>

</div>
